<label>{{ t('Username') }}<input name="username" value="{{ request.form.get('username', account.username if account else '') }}" maxlength="80" required {% if account and account.username == 'admin' %}readonly{% endif %}></label>
<label>{{ t('Password') }}{% if account %}<small>{{ t('Leave blank to keep the current password.') }}</small>{% endif %}<input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" {% if not account %}required{% endif %}></label>
<label>{{ t('Role') }}<select name="role">{% for role in ['Member','Guest','Staff','Admin'] %}<option value="{{ role }}" {% if request.form.get('role', account.role if account else 'Staff') == role %}selected{% endif %}>{{ t(role) }}</option>{% endfor %}</select></label>
<label>{{ t('Linked profile') }}<select name="member_id"><option value="">{{ t('None') }}</option>{% for profile in profiles %}<option value="{{ profile.id }}" {% if request.form.get('member_id', account.member_id|string if account and account.member_id else '') == profile.id|string %}selected{% endif %}>{{ profile.name }} · {{ profile.code }} · {{ t('Guest' if profile.is_guest else 'Member') }}</option>{% endfor %}</select></label>
<label class="checkbox"><input type="checkbox" name="active" value="1" {% if request.form.get('active') == '1' or (not request.form and (not account or account.active)) %}checked{% endif %}>{{ t('Active') }}</label>
