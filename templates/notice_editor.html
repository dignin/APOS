<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ t('Edit notice') }} · {{ system_title }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="notice-editor-page"><form id="notice-form" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="content" id="notice-content"><input type="hidden" name="content_format" id="notice-format" value="{{ source_format }}"><input type="hidden" name="notice_language" value="{{ lang }}">
<div class="editor-header"><h1>{{ t('Legal notice') if kind == 'legal_notice' else t('Privacy notice') }} · {{ 'Deutsch' if lang == 'de' else 'English' }}</h1><div><select name="lang" form="editor-language" aria-label="{{ t('Language') }}"><option value="en" {% if lang == 'en' %}selected{% endif %}>English</option><option value="de" {% if lang == 'de' %}selected{% endif %}>Deutsch</option></select><button type="submit" form="editor-language" class="secondary">{{ t('Apply') }}</button><a href="{{ url_for('settings') }}">{{ t('Cancel') }}</a> <button type="submit">{{ t('Save notice') }}</button></div></div>
<p class="editor-hint">{{ t('Replace all example placeholders before publishing. Missing translations use English.') }}</p>
<div class="editor-mode"><button type="button" id="visual-mode">{{ t('Visual editor') }}</button><button type="button" id="markdown-mode">Markdown</button><span id="preview-status" role="status"></span></div>
<div class="editor-toolbar" role="toolbar" aria-label="{{ t('Formatting') }}"><button type="button" data-command="bold">{{ t('Bold') }}</button><button type="button" data-command="italic">{{ t('Italic') }}</button><button type="button" data-command="formatBlock" data-value="h2">{{ t('Heading') }}</button><button type="button" data-command="formatBlock" data-value="p">{{ t('Paragraph') }}</button><button type="button" data-command="insertUnorderedList">{{ t('List') }}</button><button type="button" data-command="undo">{{ t('Undo') }}</button><button type="button" id="load-example">{{ t('Load example') }}</button></div>
<div data-preview-url="{{ url_for('notice_preview') }}" id="notice-editor" class="notice-text" contenteditable="true" role="textbox" aria-multiline="true" aria-label="{{ t('Notice text') }}">{{ notice }}</div>
<div id="markdown-workspace" hidden><label>{{ t('Markdown source') }}<textarea id="markdown-source" maxlength="20000" rows="20">{{ source if source_format == 'markdown' else '' }}</textarea></label><section><h2>{{ t('Preview') }}</h2><div id="markdown-preview" class="notice-text">{{ notice }}</div></section></div>
<template id="notice-example">{{ example }}</template>
<noscript>{{ t('Enable JavaScript to edit this notice.') }}</noscript></form>
<form id="editor-language" method="post" action="{{ url_for('language') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ url_for('edit_notice',kind=kind) }}"></form>
<script src="{{ url_for('static',filename='notice_editor.js') }}" defer></script></body></html>
